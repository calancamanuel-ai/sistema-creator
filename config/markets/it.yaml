# Profilo del mercato italiano. Valori di partenza: si ritarano dopo il test.
mercato: it
lingua: italiano
tono: >
  Dai del tu. Cordiale e diretto, frasi brevi, nessun tono da venditore,
  nessuna promessa di guadagno. Un riferimento concreto a 1-2 contenuti del creator.
soglie:
  follower_min: 10000
  follower_max: 100000
